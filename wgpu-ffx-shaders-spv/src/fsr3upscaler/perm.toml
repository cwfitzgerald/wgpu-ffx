[path]
subdirectory = "fsr3upscaler"
prefix = "ffx_fsr3upscaler_"
suffix = "_pass"

[base]
FFX_GPU = 1
FFX_GLSL = 1

FFX_FSR3UPSCALER_OPTION_UPSAMPLE_SAMPLERS_USE_DATA_HALF = 0
FFX_FSR3UPSCALER_OPTION_ACCUMULATE_SAMPLERS_USE_DATA_HALF = 0
FFX_FSR3UPSCALER_OPTION_REPROJECT_SAMPLERS_USE_DATA_HALF = 1
FFX_FSR3UPSCALER_OPTION_POSTPROCESSLOCKSTATUS_SAMPLERS_USE_DATA_HALF = 0
FFX_FSR3UPSCALER_OPTION_UPSAMPLE_USE_LANCZOS_TYPE = 2
# We can't use waves yet as spirv-in doesn't support QuadOps yet
FFX_SPD_NO_WAVE_OPERATIONS = 1

[permutations]
# Shaders currently require u16 support to use f16
FFX_HALF = [0]
# No way for subgroup size control currently.
FFX_WAVE64 = [0]

# Reproject can use either reference lanczos or LUT
FFX_FSR3UPSCALER_OPTION_REPROJECT_USE_LANCZOS_TYPE = [0, 1]
FFX_FSR3UPSCALER_OPTION_HDR_COLOR_INPUT = [0, 1]
FFX_FSR3UPSCALER_OPTION_LOW_RESOLUTION_MOTION_VECTORS = [0, 1]
FFX_FSR3UPSCALER_OPTION_JITTERED_MOTION_VECTORS = [0, 1]
FFX_FSR3UPSCALER_OPTION_INVERTED_DEPTH = [0, 1]

# Field permutations generate extra struct fields instead of match arms.
# The "off" value uses the base field name, the "on" value appends the suffix.
[field_permutations.FFX_FSR3UPSCALER_OPTION_APPLY_SHARPENING]
values = [0, 1]
suffix = "sharpen"
