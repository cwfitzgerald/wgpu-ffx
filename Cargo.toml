[workspace]
resolver = "3"
members = ["wgpu-ffx", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints]

[workspace.dependencies]
anyhow = "1.0"
bitflags = "2"
bytemuck = "1.14"
camino = { version = "1.1", features = ["serde1"] }
indicatif = "0.17"
pico-args = "0.5"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
wgpu = { version = "26", default-features = false }
