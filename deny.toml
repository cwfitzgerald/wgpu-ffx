[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
skip = [
    # wgpu's dependency tree pulls in both hashbrown:
    # - 0.15 (via gpu-descriptor, petgraph)
    # - 0.16 (via gpu-allocator, naga, wgpu-core)
    # - 0.17 (via indexmap)
    { crate = "hashbrown@0.15", reason = "wgpu transitive dependency split" },
    { crate = "hashbrown@0.16", reason = "wgpu transitive dependency split" },

    # foldhash 0.1 and 0.2 follow the same hashbrown 0.15/0.16 split.
    { crate = "foldhash@0.1", reason = "wgpu transitive dependency split" },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"

[advisories]
ignore = []
